[package]
name = "roa"
version = "0.3.0"
edition = "2024"

[dependencies]
aws-config = { version = "1.8.12", features = ["credentials-login"] }
aws-sdk-ec2 = "1.199.0"
aws-sdk-route53 = { version = "1.108.0" , features = ["behavior-version-latest"]}
clap = { version = "4.5.53", features = ["derive", "env"] }
tokio = { version = "1.48.0", features = ["full"] }
base64 = "0.22.1"
home = "0.5.12"
dotenvy = "0.15.7"
reqwest = "0.13.2"
serde = "1.0.228"
serde_json = "1.0.149"
serde_norway = "0.9.42"
chrono = { version = "0.4.44", features = ["serde"] }
